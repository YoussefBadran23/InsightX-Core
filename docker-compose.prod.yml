# ── InsightX Production Stack ─────────────────────────────────────────────────
# Droplet: 8 GB RAM / 4 vCPUs / 240 GB / Ubuntu 22.04 / FRA1
# Public IP: 167.172.173.239
#
# Deploy:
#   cp backend/.env.example backend/.env   # fill in real secrets
#   cp worker/.env.example  worker/.env
#   echo "BACKEND_URL=http://167.172.173.239" >> .env
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── 1. PostgreSQL ────────────────────────────────────────────────────────────
  # NOTE: swap this out for DO Managed PostgreSQL when budget allows —
  # just change DATABASE_URL in .env and remove this service.
  db:
    image: postgres:16-alpine
    container_name: insightx_db
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1.5g   # 8 GB droplet — Postgres gets 1.5 GB

  # ── 2. Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: insightx_redis
    restart: always
    volumes:
      - redis_data:/data
      - ./infrastructure/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768m   # redis.conf caps at 512 mb; container gets a bit more headroom

  # ── 3. Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: insightx_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"   # ready for certbot / SSL termination
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 128m

  # ── 4. FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insightx_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      APP_ENV:              production
      DATABASE_URL:         ${DATABASE_URL}
      REDIS_URL:            ${REDIS_URL}
      CELERY_BROKER_URL:    ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      FRONTEND_URL:         http://167.172.173.239
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # 4 uvicorn workers for 4 vCPUs. Backend is mostly I/O-bound (DB + Celery
    # task dispatch) so one worker per CPU is a good fit.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    deploy:
      resources:
        limits:
          memory: 1g

  # ── 5. Celery Worker (Analytics Engine) ──────────────────────────────────────
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: insightx_worker
    restart: always
    env_file:
      - ./worker/.env
    environment:
      APP_ENV:              production
      DATABASE_URL:         ${DATABASE_URL}
      REDIS_URL:            ${REDIS_URL}
      CELERY_BROKER_URL:    ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    volumes:
      - ./backend/app:/app/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # concurrency=4 matches 4 vCPUs. Analytics tasks (pandas/numpy) are
    # CPU-bound so prefork (default) is the right pool. --loglevel=warning
    # keeps logs clean in production; raise to info only when debugging.
    command: celery -A celery_app worker --loglevel=warning --concurrency=4 -Q celery,analytics,ml
    deploy:
      resources:
        limits:
          memory: 3g     # pandas/numpy can spike — give worker the most RAM

  # ── 6. Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars are baked into the JS bundle at build time.
        # The browser calls this URL directly — must be the public IP/domain.
        # api.ts auto-appends /api/v1, so just the IP is enough.
        NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://167.172.173.239}
    container_name: insightx_frontend
    restart: always
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    command: npm start
    deploy:
      resources:
        limits:
          memory: 512m

  # ── 7. Datadog Agent (Monitoring) ────────────────────────────────────────────
  datadog:
    image: datadog/agent:latest
    container_name: insightx_datadog
    restart: always
    environment:
      DD_API_KEY:              ${DD_API_KEY}
      DD_SITE:                 datadoghq.eu   # EU region — Frankfurt droplet
      DD_LOGS_ENABLED:         "true"
      DD_APM_ENABLED:          "true"
      DD_PROCESS_AGENT_ENABLED: "true"
      DD_HOSTNAME:             insightx-fra1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    depends_on:
      - backend
      - worker
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  postgres_data:
  redis_data:
  uploads_data:
