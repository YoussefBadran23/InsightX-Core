# ── InsightX Nginx — Production Reverse Proxy ────────────────────────────────
# Droplet: 8 GB RAM / 4 vCPUs / Ubuntu 22.04 / Frankfurt FRA1
# Public IP: 167.172.173.239
#
# Routing:
#   /api/*    → FastAPI backend (backend:8000) — keeps full path intact
#   /docs     → FastAPI Swagger UI (useful for demo/grading)
#   /         → Next.js frontend (frontend:3000)
#
# To add HTTPS (Let's Encrypt) once you have a domain:
#   1. Point a domain A record to 167.172.173.239
#   2. Install certbot: sudo apt install certbot python3-certbot-nginx
#   3. Run: sudo certbot --nginx -d yourdomain.com
#   Certbot will automatically rewrite this file with SSL directives.
# ─────────────────────────────────────────────────────────────────────────────

# One worker per CPU core (4 vCPUs = 4 workers)
worker_processes auto;

# Raise open-file limit for many concurrent connections
worker_rlimit_nofile 65535;

events {
    worker_connections 2048;   # 4 workers × 2048 = 8192 max simultaneous connections
    use epoll;                 # Linux epoll is the fastest event model
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;    # Hide nginx version from error pages / headers

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   4;       # Level 4 = good balance of speed vs ratio
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml font/ttf image/svg+xml;

    # ── Rate Limiting zones ───────────────────────────────────────────────────
    # General API: 20 req/s per IP, burst of 50 (handles normal browser page loads)
    limit_req_zone $binary_remote_addr zone=api_limit:10m      rate=20r/s;
    # Upload: 2 req/min per IP — CSV uploads are heavy, prevent abuse / re-uploads
    limit_req_zone $binary_remote_addr zone=upload_limit:10m   rate=2r/m;
    # Auth: 10 req/min per IP — brute-force protection on login/register
    limit_req_zone $binary_remote_addr zone=auth_limit:10m     rate=10r/m;

    # ── Upstream services ─────────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;          # Reuse connections — saves TCP handshake overhead
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ── HTTP Server ───────────────────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name 167.172.173.239 _;   # Matches IP + any domain pointed here

        # ── Security Headers ─────────────────────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin"  always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

        # ── Upload endpoints — large body + extended timeouts ────────────────
        # /api/v1/upload/sniff + /api/v1/upload/confirm can take minutes for
        # large CSVs + Celery task dispatch. These overrides prevent 413 / 504.
        location ~ ^/api/v1/upload {
            client_max_body_size  120m;    # matches MAX_UPLOAD_SIZE_MB=100 + headroom
            proxy_read_timeout    600s;    # 10 min — allows Celery task to dispatch
            proxy_send_timeout    300s;
            proxy_connect_timeout 10s;

            limit_req zone=upload_limit burst=3 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection       "";
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Auth endpoints — strict rate limit ───────────────────────────────
        location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password) {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection       "";
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── All other API calls ───────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection       "";
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # FastAPI interactive docs (handy for grading/demo)
        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
        }

        # ── Next.js Frontend ─────────────────────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade          $http_upgrade;
            proxy_set_header   Connection       "upgrade";  # WebSocket passthrough
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Next.js static assets — aggressive browser caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            proxy_pass http://frontend;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ── Block dot-files (.env, .git, etc.) ───────────────────────────────
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
