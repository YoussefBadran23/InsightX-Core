# ── InsightX Redis Configuration ────────────────────────────────────────────
# Redis only supports full-line comments (starting with #).
# Inline comments after directive values are NOT supported and will
# cause the server to fail to start.
# ────────────────────────────────────────────────────────────────────────────

# ── Network ──────────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode no

# ── Persistence ──────────────────────────────────────────────────────────────
# Save a snapshot if at least N keys changed within M seconds.
save 3600 1
save 300 100
save 60 10000

dbfilename dump.rdb
dir /data

# ── Memory ───────────────────────────────────────────────────────────────────
# Cap Redis at 256 MB — prevents OOM-killing the whole droplet on a shared server.
# Raise this if the droplet has more RAM to spare (e.g. 512mb on a 4 GB droplet).
# Evict least-recently-used keys when the cap is hit (good for a Celery broker).
maxmemory 512mb
maxmemory-policy allkeys-lru

# ── Logging ──────────────────────────────────────────────────────────────────
loglevel notice
logfile ""

# ── Performance ──────────────────────────────────────────────────────────────
tcp-keepalive 300
timeout 0
